services:
  db:
    image: ${POSTGRES_IMAGE}
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      shared:
        aliases:
          - postgres

volumes:
  pgdata:

networks:
  shared:
    external: true
    name: ${SHARED_NETWORK}
